name: Package Desktop · Linux .deb

on:
  workflow_dispatch:
    inputs:
      update_channel:
        description: 'Update channel: nightly or latest'
        type: choice
        options: [nightly, latest]
        default: nightly
        required: true
  push:
    branches:
      - master
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/package-linux-deb.yml'

permissions:
  contents: write

concurrency:
  group: linux-desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg fakeroot libarchive-tools

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Package Desktop Linux (.deb)
        env:
          DSH_DESKTOP_UPDATE_CHANNEL: ${{ inputs.update_channel || 'nightly' }}
          DSH_TELEMETRY_DISABLED: '1'
        run: pnpm run package:desktop:linux:x64

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-deb
          path: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb
          if-no-files-found: error

      - name: Create Release and Attach .deb
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb
          draft: false
          prerelease: true
        continue-on-error: true
